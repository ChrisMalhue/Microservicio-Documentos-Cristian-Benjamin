server.port=${PORT:8082}

# Límite para subir archivos (hasta 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Conexión directa a Neon (sin -pooler y con channelBinding=disable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-sparkling-mouse-b6k53dvf.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_9ZwAzYx1ItbF}
spring.datasource.driver-class-name=org.postgresql.Driver

# Estabilidad de conexiones (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect